name: ChatCards
options:
  bundleIdPrefix: io.github.schaeferanjon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ChatCardsCore:
    path: Core
targets:
  ChatCards:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: ChatCardsCore
        product: ChatCardsCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChatCards
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        LSApplicationCategoryType: public.app-category.education
        CFBundleURLTypes:
          - CFBundleURLName: io.github.schaeferanjon.chatcards
            CFBundleURLSchemes: [chatcards, ankilearn]
    settings:
      base:
        PRODUCT_NAME: ChatCards
        EXECUTABLE_NAME: ChatCards
        PRODUCT_MODULE_NAME: ChatCards
        PRODUCT_BUNDLE_IDENTIFIER: io.github.schaeferanjon.chatcards
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        # 默认临时签名（ad-hoc），谁都能编；用自己的证书签：make build TEAM=<Team ID>（见 Makefile）
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
